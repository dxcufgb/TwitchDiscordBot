name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  # The Release workflow runs this whole CI first, with the version it releases: the installers are then tested
  # with exactly that version stamped in, and the setup wizard it attaches is the one built and installed here.
  workflow_call:
    inputs:
      version:
        description: "Release version to stamp into the built files (default: twitchbot.__version__)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          # No cache when the Release workflow calls this.
          cache: ${{ !inputs.version && 'pip' || '' }}
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  # Installs the release archive on a real systemd host. The credentials are fake on purpose:
  # Discord rejecting the token proves the service started as the bot user, read .env and wrote its log.
  installer-linux:
    # A hung installer (e.g. waiting on a dialog) must fail fast instead of running for hours.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Shellcheck
        run: shellcheck packaging/linux/install.sh packaging/linux/auto-update.sh start-bot.sh scripts/install-service.sh
      - name: Build release archives
        run: python3 scripts/build_release.py --out dist ${VERSION:+--version "$VERSION"}
      - name: Install (systemd service)
        run: |
          tar xzf dist/twitchdiscordbot-*-linux.tar.gz -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"/twitchdiscordbot-*/
          sudo DISCORD_TOKEN=ci-fake-token TWITCH_APP_ID=ci TWITCH_APP_SECRET=ci UPDATE_GITHUB_TOKEN=ci_fake_update_token \
            ./install.sh --yes --skip-check --auto-update \
            || echo "installer exited with $? (expected: the bot can't log in with a fake token)"
          sudo systemd-analyze verify /etc/systemd/system/twitchdiscordbot.service \
            /etc/systemd/system/twitchdiscordbot-update.service /etc/systemd/system/twitchdiscordbot-update.timer
          test "$(sudo stat -c '%U:%G %a' /opt/twitchdiscordbot/.env)" = "root:twitchbot 640"
          test "$(sudo stat -c '%U:%G %a' /opt/twitchdiscordbot/updater)" = "root:root 700"
          test "$(sudo stat -c '%U:%G %a' /opt/twitchdiscordbot/updater/github-token)" = "root:root 600"
          # Program files are root's and not writable by the bot user, which owns only data/ and logs/.
          test "$(sudo stat -c '%U:%G %a' /opt/twitchdiscordbot)" = "root:root 755"
          test "$(sudo stat -c '%U:%G' /opt/twitchdiscordbot/data /opt/twitchdiscordbot/logs | sort -u)" = "twitchbot:twitchbot"
          loose="$(sudo find /opt/twitchdiscordbot \( -path /opt/twitchdiscordbot/data -o -path /opt/twitchdiscordbot/logs \) \
            -prune -o ! -type l \( ! -user root -o -perm /022 \) -print)"
          if [ -n "$loose" ]; then echo "Not root-owned or writable by others: $loose"; exit 1; fi
          systemctl is-enabled twitchdiscordbot-update.timer
          for _ in $(seq 30); do
            sudo grep -q "Discord rejected the bot token" /opt/twitchdiscordbot/logs/bot.log 2>/dev/null && break
            sleep 2
          done
          sudo cat /opt/twitchdiscordbot/logs/bot.log
          sudo grep -q "Discord rejected the bot token" /opt/twitchdiscordbot/logs/bot.log
          systemctl show twitchdiscordbot -p User -p UnitFileState | tee /dev/stderr | grep -q "User=twitchbot"
          # The installed copy carries the version it was built with (from the tag in a release).
          expected="${VERSION:-$(python3 -c 'import twitchbot; print(twitchbot.__version__)')}"
          test "$(cat /opt/twitchdiscordbot/VERSION)" = "$expected"
          sudo /opt/twitchdiscordbot/.venv/bin/python -B /opt/twitchdiscordbot/Main.py --version | tee /dev/stderr |
            grep -qx "TwitchDiscordBot $expected"
      - name: Upgrade in place, then uninstall
        run: |
          cd "$RUNNER_TEMP"/twitchdiscordbot-*/
          sudo ./install.sh --yes --skip-check || true
          sudo grep -q "ci-fake-token" /opt/twitchdiscordbot/.env
          # Program files are root's and not writable by the bot user, which owns only data/ and logs/.
          test "$(sudo stat -c '%U:%G %a' /opt/twitchdiscordbot)" = "root:root 755"
          test "$(sudo stat -c '%U:%G' /opt/twitchdiscordbot/data /opt/twitchdiscordbot/logs | sort -u)" = "twitchbot:twitchbot"
          loose="$(sudo find /opt/twitchdiscordbot \( -path /opt/twitchdiscordbot/data -o -path /opt/twitchdiscordbot/logs \) \
            -prune -o ! -type l \( ! -user root -o -perm /022 \) -print)"
          if [ -n "$loose" ]; then echo "Not root-owned or writable by others: $loose"; exit 1; fi
          # The upgrade keeps the auto-update choice and token; a check with a fake token fails without leaking it.
          systemctl is-enabled twitchdiscordbot-update.timer
          sudo grep -q "ci_fake_update_token" /opt/twitchdiscordbot/updater/github-token
          out="$(sudo /opt/twitchdiscordbot/auto-update.sh --check 2>&1)" && code=0 || code=$?
          echo "$out (exit code $code)"
          if grep -q "ci_fake_update_token" <<<"$out"; then echo "token leaked into the output"; exit 1; fi
          # The common installer options: --check-update exits 0 / 10 / other (a fake token is an error).
          ./install.sh --help | grep -q -- "--check-update"
          out="$(sudo /opt/twitchdiscordbot/install.sh --check-update 2>&1)" && code=0 || code=$?
          echo "$out (exit code $code)"
          test "$code" = 1
          if grep -q "ci_fake_update_token" <<<"$out"; then echo "token leaked into the output"; exit 1; fi
          sudo /opt/twitchdiscordbot/install.sh --disable-auto-update
          test ! -e /opt/twitchdiscordbot/updater
          if systemctl is-enabled twitchdiscordbot-update.timer 2>/dev/null; then echo "timer still enabled"; exit 1; fi
          # Without a stored token, the one-liner's INSTALL_GITHUB_TOKEN is used for the check only, never stored.
          out="$(sudo INSTALL_GITHUB_TOKEN=ci_fake_install_token ./install.sh --check-update 2>&1)" && code=0 || code=$?
          echo "$out (exit code $code)"
          test "$code" = 1
          if grep -q "No GitHub token" <<<"$out"; then echo "the token from the environment was not used"; exit 1; fi
          if grep -q "ci_fake_install_token" <<<"$out"; then echo "token leaked into the output"; exit 1; fi
          test ! -e /opt/twitchdiscordbot/updater
          # --yes --enable-auto-update stores INSTALL_GITHUB_TOKEN as the updater token (root 600).
          sudo INSTALL_GITHUB_TOKEN=ci_fake_install_token ./install.sh --yes --enable-auto-update
          systemctl is-enabled twitchdiscordbot-update.timer
          test "$(sudo stat -c '%U:%G %a' /opt/twitchdiscordbot/updater/github-token)" = "root:root 600"
          sudo grep -qx "ci_fake_install_token" /opt/twitchdiscordbot/updater/github-token
          sudo /opt/twitchdiscordbot/install.sh --uninstall --purge
          test ! -e /opt/twitchdiscordbot
          test ! -e /etc/systemd/system/twitchdiscordbot.service
          test ! -e /etc/systemd/system/twitchdiscordbot-update.timer
          test ! -e /etc/systemd/system/twitchdiscordbot-update.service
          ! id twitchbot

  # Same on Windows: scheduled task running as LOCAL SERVICE, installed with Windows PowerShell 5.1.
  installer-windows:
    # A hung installer (e.g. waiting on a dialog) must fail fast instead of running for hours.
    timeout-minutes: 20
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          # Write-Host is intended (coloured installer output); ShouldProcess makes no sense for an installer script.
          $issues = foreach ($script in 'packaging/windows/install.ps1', 'packaging/windows/auto-update.ps1', 'scripts/install-startup.ps1') {
            Invoke-ScriptAnalyzer -Path $script -Severity Warning, Error `
              -ExcludeRule PSAvoidUsingWriteHost, PSUseShouldProcessForStateChangingFunctions
          }
          $issues | Format-Table -AutoSize -Wrap RuleName, ScriptName, Line, Message
          if ($issues) { exit 1 }
      - name: Build release archives
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $buildArgs = @('--out', 'dist')
          if ($env:VERSION) { $buildArgs += @('--version', $env:VERSION) }
          python scripts/build_release.py @buildArgs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Install (scheduled task)
        shell: pwsh
        run: |
          Expand-Archive (Get-Item dist/twitchdiscordbot-*-windows.zip) -DestinationPath $env:RUNNER_TEMP
          $src = (Get-ChildItem $env:RUNNER_TEMP -Directory -Filter 'twitchdiscordbot-*')[0].FullName
          $env:DISCORD_TOKEN = 'ci-fake-token'; $env:TWITCH_APP_ID = 'ci'; $env:TWITCH_APP_SECRET = 'ci'
          $env:UPDATE_GITHUB_TOKEN = 'ci_fake_update_token'
          powershell -NoProfile -ExecutionPolicy Bypass -File "$src\install.ps1" -Yes -SkipCheck -AutoUpdate
          "installer exit code: $LASTEXITCODE (non-zero expected: the bot can't log in with a fake token)"
          Remove-Item Env:UPDATE_GITHUB_TOKEN
          $dir = "$env:ProgramData\TwitchDiscordBot"
          $task = Get-ScheduledTask -TaskName TwitchDiscordBot
          "task runs as: $($task.Principal.UserId)"
          if ($task.Principal.UserId -notmatch 'LOCAL ?SERVICE') { throw 'task should run as LOCAL SERVICE' }
          $readers = (Get-Acl "$dir\.env").Access.IdentityReference.Value
          "'.env' readable by: $($readers -join ', ')"
          if ($readers -match 'Users|Everyone') { throw '.env must not be readable by normal users' }
          $update = Get-ScheduledTask -TaskName 'TwitchDiscordBot Update'
          "update task runs as: $($update.Principal.UserId)"
          if ($update.Principal.UserId -notmatch 'SYSTEM') { throw 'update task should run as SYSTEM' }
          $tokenReaders = (Get-Acl "$dir\updater\github-token").Access.IdentityReference.Value
          "'github-token' readable by: $($tokenReaders -join ', ')"
          if ($tokenReaders -match 'Users|Everyone|LOCAL SERVICE') { throw 'github-token must be Administrators/SYSTEM only' }
          $log = "$dir\logs\bot.log"
          foreach ($i in 1..30) {
            if ((Test-Path $log) -and (Select-String -Quiet -Path $log -Pattern 'Discord rejected the bot token')) { break }
            Start-Sleep -Seconds 2
          }
          Get-Content $log, "$dir\logs\console.log" -ErrorAction SilentlyContinue
          if (-not (Select-String -Quiet -Path $log -Pattern 'Discord rejected the bot token')) { throw 'bot did not run' }
          exit 0
      - name: Upgrade in place, then uninstall
        shell: pwsh
        run: |
          $src = (Get-ChildItem $env:RUNNER_TEMP -Directory -Filter 'twitchdiscordbot-*')[0].FullName
          $dir = "$env:ProgramData\TwitchDiscordBot"
          powershell -NoProfile -ExecutionPolicy Bypass -File "$src\install.ps1" -Yes -SkipCheck
          if (-not (Select-String -Quiet -Path "$dir\.env" -Pattern 'ci-fake-token')) { throw 'settings lost on upgrade' }
          if (-not (Get-ScheduledTask -TaskName 'TwitchDiscordBot Update' -ErrorAction SilentlyContinue)) { throw 'auto-update lost on upgrade' }
          if (-not (Test-Path "$dir\updater\github-token")) { throw 'update token lost on upgrade' }
          powershell -NoProfile -ExecutionPolicy Bypass -File "$dir\install.ps1" -Uninstall -Purge
          if (Get-ScheduledTask -TaskName TwitchDiscordBot -ErrorAction SilentlyContinue) { throw 'task not removed' }
          if (Get-ScheduledTask -TaskName 'TwitchDiscordBot Update' -ErrorAction SilentlyContinue) { throw 'update task not removed' }
          if (Test-Path $dir) { throw 'install folder not removed' }
          exit 0

  # Builds the setup wizard (Inno Setup, preinstalled on the runner), installs it silently with fake
  # credentials, checks the result, upgrades over it and uninstalls with /PURGE.
  windows-setup:
    # A hung installer (e.g. waiting on a dialog) must fail fast instead of running for hours.
    timeout-minutes: 20
    runs-on: windows-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"
      - name: Build setup.exe
        shell: pwsh
        run: |
          $version = if ($env:VERSION) { $env:VERSION } else { python -c "import twitchbot; print(twitchbot.__version__)" }
          # The twitchbot package with the version stamped in (the repository itself keeps its version).
          python scripts/build_release.py --out build/release --version $version --code-dir build/twitchbot
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "Inno Setup not found at $iscc" }
          & $iscc /Qp "/DAppVersion=$version" "/DCodeDir=$((Resolve-Path build/twitchbot).Path)" packaging/windows/TwitchDiscordBot.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem dist | Format-Table Name, Length
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-setup
          path: dist/*-setup.exe
          if-no-files-found: error
      - name: Silent install
        shell: pwsh
        run: |
          $exe = (Get-Item dist/*-setup.exe).FullName
          $env:DISCORD_TOKEN = 'ci-fake-token'; $env:TWITCH_APP_ID = 'ci'; $env:TWITCH_APP_SECRET = 'ci'
          $env:UPDATE_GITHUB_TOKEN = 'ci_fake_update_token'
          $p = Start-Process $exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/MERGETASKS=autoupdate', "/LOG=$env:RUNNER_TEMP\setup-1.log" -Wait -PassThru
          "setup exit code: $($p.ExitCode)"
          $dir = "$env:ProgramData\TwitchDiscordBot"
          Get-Content "$dir\logs\setup.log" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\setup-1.log"; throw 'setup failed' }
          if (-not (Test-Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\{B7E3F0A4-5C2D-4E8B-9F1A-6D3C2B7A8E51}_is1')) {
            throw 'no Apps & features entry'
          }
          $task = Get-ScheduledTask -TaskName TwitchDiscordBot
          "task runs as: $($task.Principal.UserId)"
          if ($task.Principal.UserId -notmatch 'LOCAL ?SERVICE') { throw 'task should run as LOCAL SERVICE' }
          $readers = (Get-Acl "$dir\.env").Access.IdentityReference.Value
          "'.env' readable by: $($readers -join ', ')"
          if ($readers -match 'Users|Everyone') { throw '.env must not be readable by normal users' }
          if (-not (Get-ScheduledTask -TaskName 'TwitchDiscordBot Update' -ErrorAction SilentlyContinue)) { throw 'autoupdate task not applied' }
          $tokenReaders = (Get-Acl "$dir\updater\github-token").Access.IdentityReference.Value
          if ($tokenReaders -match 'Users|Everyone|LOCAL SERVICE') { throw 'github-token must be Administrators/SYSTEM only' }
          $expected = if ($env:VERSION) { $env:VERSION } else { python -c "import twitchbot; print(twitchbot.__version__)" }
          if ((Get-Content "$dir\VERSION").Trim() -ne $expected) { throw 'VERSION mismatch' }
          if ((Get-Content -Raw "$dir\twitchbot\__init__.py") -notmatch [regex]::Escape("__version__ = `"$expected`"")) { throw '__version__ not stamped' }
          $log = "$dir\logs\bot.log"
          foreach ($i in 1..30) {
            if ((Test-Path $log) -and (Select-String -Quiet -Path $log -Pattern 'Discord rejected the bot token')) { break }
            Start-Sleep -Seconds 2
          }
          Get-Content $log -ErrorAction SilentlyContinue
          if (-not (Select-String -Quiet -Path $log -Pattern 'Discord rejected the bot token')) { throw 'bot did not run' }
          exit 0
      - name: Upgrade by running setup again, then uninstall with /PURGE
        shell: pwsh
        run: |
          $exe = (Get-Item dist/*-setup.exe).FullName
          $dir = "$env:ProgramData\TwitchDiscordBot"
          Remove-Item Env:DISCORD_TOKEN, Env:TWITCH_APP_ID, Env:TWITCH_APP_SECRET, Env:UPDATE_GITHUB_TOKEN -ErrorAction SilentlyContinue
          $p = Start-Process $exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$env:RUNNER_TEMP\setup-2.log" -Wait -PassThru
          "upgrade exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\setup-2.log"; throw 'upgrade failed' }
          if (-not (Select-String -Quiet -Path "$dir\.env" -Pattern 'ci-fake-token')) { throw 'settings lost on upgrade' }
          if (-not (Get-ScheduledTask -TaskName TwitchDiscordBot -ErrorAction SilentlyContinue)) { throw 'task missing after upgrade' }
          if (-not (Get-ScheduledTask -TaskName 'TwitchDiscordBot Update' -ErrorAction SilentlyContinue)) { throw 'auto-update lost on upgrade' }
          $p = Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/PURGE' -Wait -PassThru
          "uninstall exit code: $($p.ExitCode)"
          foreach ($i in 1..30) { if (-not (Test-Path $dir)) { break }; Start-Sleep -Seconds 2 }
          if (Get-ScheduledTask -TaskName TwitchDiscordBot -ErrorAction SilentlyContinue) { throw 'task not removed' }
          if (Get-ScheduledTask -TaskName 'TwitchDiscordBot Update' -ErrorAction SilentlyContinue) { throw 'update task not removed' }
          if (Test-Path $dir) { Get-ChildItem -Recurse -Force $dir | Select-Object -First 20 FullName; throw 'install folder not removed' }
          if (Test-Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\{B7E3F0A4-5C2D-4E8B-9F1A-6D3C2B7A8E51}_is1') {
            throw 'Apps & features entry not removed'
          }
          exit 0
