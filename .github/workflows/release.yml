name: Release

# Push a tag like v2.0.0 (matching twitchbot/__version__) to test, build and publish a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build release archives
        run: python scripts/build_release.py --expect-version "$GITHUB_REF_NAME"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" \
            dist/*-linux.tar.gz dist/*-windows.zip dist/SHA256SUMS.txt \
            --title "TwitchDiscordBot ${GITHUB_REF_NAME#v}" \
            --notes-file dist/RELEASE_NOTES.md --generate-notes --verify-tag "${flags[@]}"
