name: Release

# How to release (the version comes from the tag; nobody bumps a version in the code):
#   * Actions -> Release -> Run workflow (on main) -> type the version, e.g. 1.2.3 (a leading v is stripped;
#     1.2.3-rc.1 makes a pre-release). The full CI runs with that version stamped into the built files, then the
#     release v1.2.3 is created on the tested commit with all files attached. Nothing is published if a job fails.
#   * Fallback: publish a release with a tag v1.2.3 by hand in the GitHub UI. This workflow then runs the same CI and
#     build for that tag and attaches the files to that release afterwards.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.2.3 (1.2.3-rc.1 makes a pre-release)"
        required: true
        type: string
  release:
    types: [published]

permissions: {}

defaults:
  run:
    shell: bash  # with pipefail

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Works out version / tag / pre-release, and fails within seconds when the release cannot be made.
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Determine the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="${INPUT_VERSION#v}"
            if [[ ! "$version" =~ $semver ]]; then
              echo "::error::The version must look like 1.2.3 or 1.2.3-rc.1 (a leading v is allowed)."
              exit 1
            fi
            if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
              echo "::error::Run this workflow on the default branch $DEFAULT_BRANCH (got $GITHUB_REF)."
              exit 1
            fi
            tag="v$version"
            if out="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" 2>&1)"; then
              echo "::error::Tag $tag already exists. Pick a new version."
              exit 1
            elif ! grep -q "HTTP 404" <<<"$out"; then
              echo "::error::Could not check whether tag $tag exists: $out"
              exit 1
            fi
            # Drafts are only listed for tokens that can write; the publish job checks again with that token.
            releases="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | .tag_name, .name')"
            if grep -Fxq "$tag" <<<"$releases"; then
              echo "::error::A release named $tag already exists (maybe a draft). Delete it or pick a new version."
              exit 1
            fi
            if [[ "$version" == *-* ]]; then prerelease=true; else prerelease=false; fi
          else
            tag="$RELEASE_TAG"
            if [[ "$tag" != v* || ! "${tag#v}" =~ $semver ]]; then
              echo "::error::The release tag must look like v1.2.3 or v1.2.3-rc.1. Delete the release and publish it again with such a tag."
              exit 1
            fi
            version="${tag#v}"
            prerelease="$RELEASE_PRERELEASE"
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $tag (pre-release: $prerelease) from $GITHUB_SHA"

  # The full CI (tests, real installs on Linux and Windows) with the release version stamped into the built files.
  # Its windows-setup job builds and installs the setup wizard that is attached to the release.
  ci:
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      # Exactly the event's commit, not the (movable) tag ref.
      ref: ${{ github.sha }}

  build:
    needs: [prepare, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Exactly the event's commit, not the (movable) tag ref.
          ref: ${{ github.sha }}
          # Full history and tags: build_release.py lists the commits since the previous release in CHANGES.md.
          fetch-depth: 0
      - name: Get the setup wizard built and tested by CI
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-setup
          path: setup
      - name: Build the release files
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python3 scripts/build_release.py --version "$VERSION" --out dist --setup-exe "setup/twitchdiscordbot-$VERSION-setup.exe"
          cd dist
          sha256sum -c --strict SHA256SUMS.txt
          ls -l
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/
          if-no-files-found: error

  publish:
    needs: [prepare, ci, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          # Every file listed in SHA256SUMS.txt, plus SHA256SUMS.txt itself (RELEASE_NOTES.md is not a release file).
          (cd dist && sha256sum -c --strict --quiet SHA256SUMS.txt)
          files=()
          while read -r _ name; do files+=("dist/$name"); done < dist/SHA256SUMS.txt
          files+=(dist/SHA256SUMS.txt)

          # The commit the tag points to (annotated tags are followed); empty if the tag does not exist.
          tag_commit() {
            local ref type sha
            ref="$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha' 2>/dev/null)" || return 0
            read -r type sha <<<"$ref"
            if [[ "$type" == "tag" ]]; then sha="$(gh api "repos/$GH_REPO/git/tags/$sha" --jq .object.sha)"; fi
            echo "$sha"
          }

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            # Checked again here: only a token that can write sees draft releases.
            releases="$(gh api --paginate "repos/$GH_REPO/releases" --jq '.[] | .tag_name, .name')"
            if grep -Fxq "$TAG" <<<"$releases"; then
              echo "::error::A release named $TAG already exists (maybe a draft). Delete it or pick a new version."
              exit 1
            fi
            gh api "repos/$GH_REPO/releases/generate-notes" -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" \
              --jq .body > generated.md
            { cat dist/RELEASE_NOTES.md; echo; cat generated.md; } > notes.md
            # A draft first: the tag is created on the tested commit only when the release is published.
            # If anything fails while it is still a draft, delete that draft so the next run is not blocked by it.
            remove_leftover_draft() {
              if [[ "$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)" == "true" ]]; then
                echo "::warning::Publishing failed; deleting the leftover draft release $TAG."
                gh release delete "$TAG" --yes || echo "::error::Could not delete the draft release $TAG; delete it by hand."
              fi
            }
            trap remove_leftover_draft EXIT
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md "${files[@]}"
            if [[ "$PRERELEASE" == "true" ]]; then
              gh release edit "$TAG" --draft=false --prerelease
            else
              gh release edit "$TAG" --draft=false --latest
            fi
            trap - EXIT
            tag_sha="$(tag_commit)"
            if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
              echo "::error::Tag $TAG points to $tag_sha, not the tested commit $GITHUB_SHA."
              exit 1
            fi
          else
            # The files were built from $GITHUB_SHA: refuse if the tag was moved (or deleted) since the event.
            tag_sha="$(tag_commit)"
            if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
              echo "::error::Tag $TAG now points to '${tag_sha:-nothing}', not $GITHUB_SHA that was tested and built. Not uploading."
              exit 1
            fi
            gh release upload "$TAG" --clobber "${files[@]}"
            # Put the install notes on top of the notes written by hand (once, also when this job is re-run).
            gh release view "$TAG" --json body --jq .body > body.md
            if ! grep -qF '<!-- install-notes -->' body.md; then
              { cat dist/RELEASE_NOTES.md; echo; cat body.md; } > notes.md
              gh release edit "$TAG" --notes-file notes.md
            fi
          fi

          {
            echo "### Released $TAG"
            echo
            echo "Pre-release: $PRERELEASE. Commit: \`$GITHUB_SHA\`. Files:"
            echo
            for f in "${files[@]}"; do echo "- \`${f#dist/}\`"; done
          } >> "$GITHUB_STEP_SUMMARY"
