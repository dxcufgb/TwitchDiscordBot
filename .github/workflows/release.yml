name: Release

# Two ways to publish a release (the version always comes from twitchbot/__version__):
#   * Actions tab -> Release -> "Run workflow" on main: creates the tag v<version> and the release.
#   * Push a tag like v2.0.0 yourself; it must match twitchbot/__version__.
# Either way the full CI (tests + real installer runs on Linux and Windows) must pass first.
# The Windows setup wizard attached to the release is the exe that CI built and installed.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Determine the tag
        id: tag
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(python -c 'import twitchbot; print(twitchbot.__version__)')"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
              echo "::error::Run this workflow on the default branch (got $GITHUB_REF)."
              exit 1
            fi
            tag="v$version"
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
              echo "::error::Tag $tag already exists. Bump the version in twitchbot/__init__.py and pyproject.toml first."
              exit 1
            fi
          else
            tag="$GITHUB_REF_NAME"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag from $GITHUB_SHA"
      - name: Build release archives
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: python scripts/build_release.py --expect-version "$TAG"
      - name: Add the setup wizard built and tested by CI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-setup
          path: dist
      - name: Add the setup wizard to the checksums
        run: |
          cd dist
          ls ./*-windows-setup.exe
          sha256sum ./*-windows-setup.exe | sed 's|  \./|  |' >> SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          flags=()
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            # Creates the tag on the commit that was tested and built.
            flags+=(--target "$GITHUB_SHA")
          else
            flags+=(--verify-tag)
          fi
          gh release create "$TAG" \
            dist/*-linux.tar.gz dist/*-windows-setup.exe dist/*-windows.zip dist/SHA256SUMS.txt \
            --title "TwitchDiscordBot ${TAG#v}" \
            --notes-file dist/RELEASE_NOTES.md --generate-notes "${flags[@]}"
