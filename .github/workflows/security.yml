# Security scans. GitHub's own secret scanning and CodeQL are not available for this private repository, so this
# workflow runs free tools instead. Identical in every dxcufgb repository except the Dependencies job (per language).
# The three job names "Secrets (gitleaks)", "Code (Semgrep)" and "Dependencies" are required status checks: keep them.
#   - Secrets (gitleaks): the whole history of the checked-out commit, with a pinned gitleaks release binary whose
#     SHA-256 is hard-coded below. Output is redacted. A true false positive (a fake token in a test) goes into
#     .gitleaks.toml as a narrow allowlist entry with a comment; the file must start with [extend] useDefault = true,
#     or it replaces the default rules instead of adding to them.
#   - Code (Semgrep): the Semgrep registry rules listed in the scan step (r/bash: every bash rule, there is no bash
#     ruleset), rules of severity WARNING and ERROR. INFO rules are style and best-practice hints, too noisy for a
#     blocking check. Fix a finding, or mark a false positive with an inline "nosemgrep: <rule-id>" comment and a
#     reason; .semgrepignore is only for vendored or generated files.
#   - Dependencies: known vulnerabilities in the pinned dependencies (see the job).
# Findings show up as annotations on the pull request. The weekly run catches new advisories and new rules for code
# that has not changed. How to run the three checks locally: README, Development.
# Updating a tool: change its version below; for gitleaks also GITLEAKS_SHA256, the sha256 of
# gitleaks_<version>_linux_x64.tar.gz from that release's gitleaks_<version>_checksums.txt.

name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays 06:23 UTC
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  SEMGREP_VERSION: "1.180.0"

jobs:
  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the whole history, not just the last commit
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          dir="$RUNNER_TEMP/gitleaks"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $dir/$archive" | sha256sum --check --strict -
          tar -xzf "$dir/$archive" -C "$dir" gitleaks
          "$dir/gitleaks" version
          echo "$dir" >> "$GITHUB_PATH"

      - name: Scan the git history
        run: |
          report="$RUNNER_TEMP/gitleaks.json"
          # .gitleaks.toml in the repository root is picked up automatically when present
          if gitleaks git --redact --no-banner --exit-code 1 --report-format json --report-path "$report" .; then
            exit 0
          fi
          jq -r '.[] | "::error file=\(.File),line=\(.StartLine),title=gitleaks \(.RuleID)::Possible secret (\(.RuleID)) in commit \(.Commit[0:12]); remove and rotate it, or allowlist a false positive in .gitleaks.toml"' "$report" || true
          exit 1

  code:
    name: Code (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Semgrep
        run: |
          python3 -m venv "$RUNNER_TEMP/semgrep"
          "$RUNNER_TEMP/semgrep/bin/pip" install --disable-pip-version-check --no-cache-dir --quiet "semgrep==${SEMGREP_VERSION}"
          echo "$RUNNER_TEMP/semgrep/bin" >> "$GITHUB_PATH"

      - name: Scan the code
        env:
          SEMGREP_SEND_METRICS: "off"
        run: |
          report="$RUNNER_TEMP/semgrep.json"
          status=0
          semgrep scan --metrics=off --disable-version-check --error \
            --severity WARNING --severity ERROR \
            --config p/python --config p/javascript --config p/security-audit \
            --config p/secrets --config p/github-actions --config r/bash \
            --json-output="$report" || status=$?
          # GitHub shows only the first few annotations of a step; this one lists every finding
          jq -r 'select(.results | length > 0) | "::error title=Semgrep: \(.results | length) finding(s)::" + ([.results[] | "\(.check_id) \(.path):\(.start.line)"] | join(" ; "))' "$report" || true
          jq -r '.results[] | "::error file=\(.path),line=\(.start.line),endLine=\(.end.line),title=\(.check_id)::\(.extra.message | gsub("[\r\n%]"; " "))"' "$report" || true
          exit "$status"

  deps:
    name: Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PIP_AUDIT_VERSION: "2.10.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install pip-audit
        run: |
          python -m venv "$RUNNER_TEMP/pip-audit"
          "$RUNNER_TEMP/pip-audit/bin/pip" install --disable-pip-version-check --no-cache-dir --quiet "pip-audit==${PIP_AUDIT_VERSION}"
          echo "$RUNNER_TEMP/pip-audit/bin" >> "$GITHUB_PATH"

      # pip-audit installs the pinned requirements into a throw-away virtual environment and checks every package
      # (dependencies of dependencies too) against the Python Packaging Advisory Database. Any known vulnerability
      # fails the job; --strict also fails it when a package cannot be audited at all.
      - name: Audit runtime dependencies (requirements.txt)
        run: pip-audit --strict --progress-spinner off --requirement requirements.txt

      - name: Audit development tools (requirements-dev.txt)
        run: pip-audit --strict --progress-spinner off --requirement requirements-dev.txt
