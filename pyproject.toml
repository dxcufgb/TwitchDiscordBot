[project]
name = "twitchdiscordbot"
version = "2.2.0"
description = "Discord bot that announces when Twitch streams go live"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
